services:
  # ---------------------------------------------------------------------------
  # Backend: FastAPI Web Service (Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: sql-chat-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ---------------------------------------------------------------------------
  # Frontend: React + Vite Static Site (Free by default on Render)
  # ---------------------------------------------------------------------------
  - type: web
    name: sql-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sql-chat-backend.onrender.com
